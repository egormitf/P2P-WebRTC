<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURMALDA-OS MESH v3.7 Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS для P2P-связи через интернет без собственного бэкенда -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #06080c;
            color: #39ff14;
            font-family: monospace;
        }
        .cyber-border {
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
        }
        .cyber-btn {
            background-color: #0c111a;
            border: 1px solid #39ff14;
            transition: all 0.2s ease-in-out;
        }
        .cyber-btn:hover:not(:disabled) {
            background-color: #39ff14;
            color: #06080c;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }
        .cyber-btn:disabled {
            border-color: #1a301a;
            color: #1a301a;
            cursor: not-allowed;
        }
        .message-bubble {
            background-color: #0c1017;
            border: 1px solid #1c321c;
        }
        .message-bubble.my-msg {
            background-color: #102110;
            border-color: #39ff14;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #06080c;
        }
        ::-webkit-scrollbar-thumb {
            background: #39ff14;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen p-4 max-w-lg mx-auto">

    <!-- Заголовок -->
    <header class="text-center my-3">
        <h1 class="text-2xl font-bold tracking-widest text-[#39ff14] uppercase">📡 BURMALDA-OS MESH v3.7</h1>
        <p class="text-[10px] text-gray-500 mt-1 font-bold">P2P ЧАТ + ФАЙЛЫ ЧЕРЕЗ ИНТЕРНЕТ (PEERJS)</p>
        <div id="connection-status" class="inline-block px-3 py-1 mt-2 text-[10px] rounded-full bg-blue-950 text-blue-400 border border-blue-500">
            Шлюз готов. Введите данные
        </div>
    </header>

    <!-- Секция настройки подключения -->
    <section id="setup-section" class="cyber-border p-4 rounded-lg space-y-4 bg-[#0a0e15]">
        <h2 class="text-center text-xs text-yellow-500 font-bold uppercase">Вход в глобальную сеть</h2>
        
        <div class="space-y-3">
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">ВАШ НИКНЕЙМ:</label>
                <input type="text" id="username-input" placeholder="Например: Сталкер" class="w-full bg-black border border-gray-800 rounded px-3 py-2 text-xs focus:outline-none focus:border-[#39ff14] text-white">
            </div>

            <div>
                <label class="block text-[10px] text-gray-400 mb-1">КОД КОМНАТЫ:</label>
                <input type="text" id="room-input" placeholder="Например: burmalda-room-1" class="w-full bg-black border border-gray-800 rounded px-3 py-2 text-xs focus:outline-none focus:border-[#39ff14] text-white">
            </div>

            <button id="btn-enter" onclick="startMesh()" class="cyber-btn w-full py-2.5 text-xs font-bold rounded uppercase">
                Подключить канал
            </button>
        </div>
    </section>

    <!-- Секция чата и обмена файлами -->
    <section id="chat-section" class="hidden flex-1 flex flex-col cyber-border rounded-lg bg-[#0a0e15] overflow-hidden mt-3">
        <!-- Список участников -->
        <div class="bg-[#0b1017] p-2 border-b border-gray-900 flex flex-wrap items-center gap-2">
            <span class="text-[10px] text-gray-500 uppercase font-bold">Статус:</span>
            <div id="peers-list" class="flex flex-wrap gap-1"></div>
        </div>

        <!-- Окно сообщений -->
        <div id="chat-box" class="flex-1 p-3 overflow-y-auto space-y-3 text-sm h-[320px]">
            <div class="text-center text-[9px] text-gray-600 border-b border-gray-900 pb-2 uppercase">
                🔒 ПРЯМОЙ ШИФРОВАННЫЙ P2P КАНАЛ ЧЕРЕЗ ИНТЕРНЕТ
            </div>
        </div>

        <!-- Прогресс передачи файлов -->
        <div id="progress-container" class="hidden px-4 py-2 bg-black border-t border-gray-900">
            <div class="flex justify-between text-[10px] mb-1">
                <span id="file-status" class="text-yellow-400">Передача...</span>
                <span id="file-percent" class="text-[#39ff14]">0%</span>
            </div>
            <div class="w-full bg-gray-900 rounded-full h-2">
                <div id="progress-bar" class="bg-[#39ff14] h-2 rounded-full transition-all duration-75" style="width: 0%"></div>
            </div>
        </div>

        <!-- Отправка файлов -->
        <div class="px-4 py-2 bg-[#0d121d] border-t border-gray-900 flex items-center justify-between gap-2">
            <input type="file" id="file-input" class="hidden" onchange="handleFileSelect()">
            <button id="btn-browse" onclick="document.getElementById('file-input').click()" class="cyber-btn text-[10px] py-2 px-3 rounded text-center flex-1 max-w-[150px] truncate font-bold">
                📎 Выбрать файл
            </button>
            <button id="btn-send-file" onclick="sendFile()" disabled class="cyber-btn text-[10px] py-2 px-3 rounded flex-1 font-bold">
                🚀 Отправить
            </button>
        </div>

        <!-- Ввод сообщения -->
        <div class="p-3 bg-black border-t border-gray-900 flex gap-2">
            <input type="text" id="msg-input" placeholder="Напиши что-нибудь в чат..." class="flex-1 bg-[#0b1017] border border-gray-800 rounded px-3 py-2 text-xs focus:outline-none focus:border-[#39ff14] text-white" onkeydown="if(event.key==='Enter') sendText()">
            <button onclick="sendText()" class="cyber-btn px-4 py-2 rounded text-xs font-bold">SEND</button>
        </div>
    </section>

    <!-- Кнопка "Выйти из сети" -->
    <div class="text-center mt-2">
        <button id="btn-leave" onclick="location.reload()" class="hidden text-[10px] text-red-500 border border-red-900 hover:bg-red-950 px-3 py-1.5 rounded uppercase font-bold">
            Выйти из сети
        </button>
    </div>

    <footer class="text-center text-[9px] text-gray-600 my-4 uppercase tracking-wider">
        BURMALDA-OS MESH System v3.7 (Standalone Internet WebRTC)
    </footer>

    <script>
        let peer = null;
        let conn = null;
        let myName = "";
        let roomId = "";
        const activeBlobs = {};

        // Настройки чанков для передачи файлов
        const CHUNK_SIZE = 16384; // 16 КБ
        let incomingFileInfo = null;
        let incomingFileData = [];
        let incomingBytesReceived = 0;

        const statusDiv = document.getElementById('connection-status');
        const setupSection = document.getElementById('setup-section');
        const chatSection = document.getElementById('chat-section');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const peersListDiv = document.getElementById('peers-list');
        const btnLeave = document.getElementById('btn-leave');
        const fileInput = document.getElementById('file-input');
        const btnBrowse = document.getElementById('btn-browse');
        const btnSendFile = document.getElementById('btn-send-file');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const fileStatus = document.getElementById('file-status');
        const filePercent = document.getElementById('file-percent');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 600) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        window.triggerDownload = function(fileId) {
            const fileData = activeBlobs[fileId];
            if (!fileData) return;
            const url = URL.createObjectURL(fileData.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileData.name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 500);
        };

        function startMesh() {
            myName = document.getElementById('username-input').value.trim() || 'Аноним';
            roomId = document.getElementById('room-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'burmalda-room';

            setupSection.classList.add('hidden');
            chatSection.classList.remove('hidden');
            btnLeave.classList.remove('hidden');

            statusDiv.innerText = `Подключение к PeerJS серверу...`;
            statusDiv.className = "inline-block px-3 py-1 mt-2 text-[10px] rounded-full bg-yellow-950 text-yellow-400 border border-yellow-500";

            // Пробуем создать хост для комнаты
            const hostId = `burmalda-room-${roomId}`;
            peer = new Peer(hostId);

            peer.on('open', () => {
                statusDiv.innerText = `Комната создана: ${roomId}`;
                statusDiv.className = "inline-block px-3 py-1 mt-2 text-[10px] rounded-full bg-green-950 text-green-400 border border-green-500";
                addSystemMsg(`Вы создали комнату "${roomId}". Введите этот же код на другом устройстве.`);
                updatePeersUI(false);
            });

            // Если ID уже занят (комната создана кем-то другим), подключаемся как клиент
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer = new Peer();
                    peer.on('open', () => {
                        statusDiv.innerText = `Подключение к комнате ${roomId}...`;
                        const connection = peer.connect(hostId);
                        setupConnection(connection);
                    });
                } else {
                    addSystemMsg(`Ошибка сети: ${err.type}`);
                }
            });

            // Принимаем входящие подключения
            peer.on('connection', (connection) => {
                setupConnection(connection);
            });
        }

        function setupConnection(connection) {
            conn = connection;

            conn.on('open', () => {
                statusDiv.innerText = `В сети. P2P Соединение установлено!`;
                statusDiv.className = "inline-block px-3 py-1 mt-2 text-[10px] rounded-full bg-green-950 text-green-400 border border-green-500";
                addSystemMsg("Узел присоединен через интернет!");
                updatePeersUI(true);
                playBeep(880);
            });

            conn.on('data', (data) => {
                if (typeof data === 'string') {
                    try {
                        const parsed = JSON.parse(data);
                        if (parsed.type === 'text') {
                            playBeep(600);
                            appendTextMessage(parsed.text, parsed.sender, false);
                        } else if (parsed.type === 'file-start') {
                            incomingFileInfo = parsed;
                            incomingFileData = [];
                            incomingBytesReceived = 0;
                            progressContainer.classList.remove('hidden');
                            fileStatus.innerText = `Прием ${parsed.name}...`;
                            progressBar.style.width = '0%';
                        }
                    } catch(e) {}
                } else if (data instanceof ArrayBuffer) {
                    incomingFileData.push(data);
                    incomingBytesReceived += data.byteLength;

                    const percent = Math.round((incomingBytesReceived / incomingFileInfo.size) * 100);
                    progressBar.style.width = `${percent}%`;
                    filePercent.innerText = `${percent}%`;

                    if (incomingBytesReceived >= incomingFileInfo.size) {
                        const blob = new Blob(incomingFileData, { type: incomingFileInfo.fileType });
                        const fileId = "file_" + Date.now();
                        activeBlobs[fileId] = { blob, name: incomingFileInfo.name };
                        
                        appendFileMessage(incomingFileInfo.name, fileId, incomingFileInfo.size, incomingFileInfo.sender, false, blob, incomingFileInfo.fileType);
                        playBeep(1000);
                        
                        setTimeout(() => progressContainer.classList.add('hidden'), 500);
                        incomingFileInfo = null;
                        incomingFileData = [];
                    }
                }
            });

            conn.on('close', () => {
                updatePeersUI(false);
                addSystemMsg("Собеседник отключился.");
            });
        }

        function updatePeersUI(isConnected) {
            peersListDiv.innerHTML = "";
            const myBadge = document.createElement('span');
            myBadge.className = "bg-green-950 border border-green-500 text-green-400 text-[10px] px-2 py-0.5 rounded font-bold";
            myBadge.innerText = `${myName} (Вы)`;
            peersListDiv.appendChild(myBadge);

            if (isConnected) {
                const badge = document.createElement('span');
                badge.className = "bg-blue-950 border border-blue-500 text-blue-400 text-[10px] px-2 py-0.5 rounded font-bold";
                badge.innerText = "Собеседник онлайн";
                peersListDiv.appendChild(badge);
            }
        }

        function addSystemMsg(text) {
            const msg = document.createElement('div');
            msg.className = 'text-center text-[10px] text-yellow-500 my-1 font-bold';
            msg.innerText = `[СИСТЕМА]: ${text}`;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendTextMessage(text, author, isMyMessage) {
            const wrap = document.createElement('div');
            wrap.className = `flex flex-col ${isMyMessage ? 'items-end' : 'items-start'}`;

            const label = document.createElement('span');
            label.className = "text-[9px] text-gray-500 px-1 mb-0.5";
            label.innerText = author;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] rounded-lg p-3 text-xs ${isMyMessage ? 'message-bubble my-msg text-[#39ff14]' : 'message-bubble text-white'}`;
            bubble.innerHTML = escapeHTML(text);

            wrap.appendChild(label);
            wrap.appendChild(bubble);
            chatBox.appendChild(wrap);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendFileMessage(name, fileId, size, author, isMyFile, blobObj = null, fileType = '') {
            const wrap = document.createElement('div');
            wrap.className = `flex flex-col ${isMyFile ? 'items-end' : 'items-start'}`;

            const label = document.createElement('span');
            label.className = "text-[9px] text-gray-500 px-1 mb-0.5";
            label.innerText = author;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] rounded-lg p-3 text-xs space-y-2 ${isMyFile ? 'message-bubble my-msg text-[#39ff14]' : 'message-bubble text-white'}`;
            
            const mbSize = (size / (1024 * 1024)).toFixed(2);
            let mediaPreview = '';

            if (blobObj && (fileType.startsWith('image/') || name.match(/\.(jpg|jpeg|png|gif|webp)$/i))) {
                const imgUrl = URL.createObjectURL(blobObj);
                mediaPreview = `<img src="${imgUrl}" class="max-w-full h-auto rounded border border-gray-800 my-1 max-h-48 object-cover"/>`;
            }

            if (isMyFile) {
                bubble.innerHTML = `
                    <div class="font-bold">📂 Отправлен файл:</div>
                    <div class="text-[10px] text-gray-400 truncate max-w-[180px]">${escapeHTML(name)}</div>
                    ${mediaPreview}
                    <div class="text-[9px] text-gray-500">Размер: ${mbSize} МБ</div>
                `;
            } else {
                bubble.innerHTML = `
                    <div class="font-bold">📂 Получен файл:</div>
                    <div class="text-[10px] text-gray-400 truncate max-w-[180px]">${escapeHTML(name)}</div>
                    ${mediaPreview}
                    <div class="text-[9px] text-gray-500">Размер: ${mbSize} МБ</div>
                    <button onclick="triggerDownload('${fileId}')" class="block w-full text-center bg-green-900 border border-green-400 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-[10px] transition duration-200 mt-2">
                        📥 Скачать файл
                    </button>
                `;
            }

            wrap.appendChild(label);
            wrap.appendChild(bubble);
            chatBox.appendChild(wrap);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendText() {
            const text = msgInput.value.trim();
            if (!text) return;

            if (conn && conn.open) {
                conn.send(JSON.stringify({ type: 'text', text: text, sender: `${myName} (Вы)` }));
                playBeep(440);
                appendTextMessage(text, `${myName} (Вы)`, true);
                msgInput.value = '';
            } else {
                addSystemMsg("Ошибка: нет активного P2P соединения с собеседником!");
            }
        }

        function handleFileSelect() {
            if (fileInput.files.length > 0) {
                btnBrowse.innerText = `📎 ${fileInput.files[0].name}`;
                btnSendFile.disabled = false;
            } else {
                btnBrowse.innerText = "📎 Выбрать файл";
                btnSendFile.disabled = true;
            }
        }

        async function sendFile() {
            const file = fileInput.files[0];
            if (!file || !conn || !conn.open) return;

            progressContainer.classList.remove('hidden');
            fileStatus.innerText = `Отправка ${file.name}...`;
            progressBar.style.width = `0%`;

            conn.send(JSON.stringify({
                type: 'file-start',
                name: file.name,
                size: file.size,
                fileType: file.type,
                sender: `${myName} (Вы)`
            }));

            const arrayBuffer = await file.arrayBuffer();
            let offset = 0;

            while (offset < arrayBuffer.byteLength) {
                const chunk = arrayBuffer.slice(offset, offset + CHUNK_SIZE);
                conn.send(chunk);
                offset += chunk.byteLength;

                const percent = Math.round((offset / arrayBuffer.byteLength) * 100);
                progressBar.style.width = `${percent}%`;
                filePercent.innerText = `${percent}%`;
                
                await new Promise(r => setTimeout(r, 10));
            }

            setTimeout(() => progressContainer.classList.add('hidden'), 500);
            appendFileMessage(file.name, null, file.size, `${myName} (Вы)`, true, file, file.type);
            fileInput.value = '';
            btnBrowse.innerText = "📎 Выбрать файл";
            btnSendFile.disabled = true;
            playBeep(1000);
        }
    </script>
</body>
</html>
